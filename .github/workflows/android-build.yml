name: Android app build

# Builds the Jobiest Android shell (apps/mobile) from main.
#   - debug APK  : installable directly on any phone (no secrets needed)
#   - release AAB: Play Store upload bundle (needs the signing secrets)
# Trigger manually from the Actions tab, or push a tag like app-v1.0.0.

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  debug-apk:
    name: Debug APK (sideload)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jobiest-debug-apk
          path: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    name: Release AAB (Play Store)
    # `secrets` is not allowed in a job-level if; gate on a repository
    # variable instead. Set ANDROID_RELEASE_ENABLED=true in
    # Settings > Secrets and variables > Actions > Variables once the
    # ANDROID_KEYSTORE_* secrets exist.
    if: vars.ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/jobiest-release.keystore
      - run: cd android && ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: /tmp/jobiest-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobiest-release-aab
          path: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
