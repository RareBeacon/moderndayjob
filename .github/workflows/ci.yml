name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-career-agent-coding-agent/ai-career-agent-coding-agent
    env:
      # Non-secret placeholders so `next build` can pre-render without real
      # credentials. Real values live in Vercel / .env.local, never here.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: https://jobiest.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-career-agent-coding-agent/ai-career-agent-coding-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Production smoke only makes sense for main pushes: PR heads never
    # deploy to production, so their SHA would never go live.
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: ai-career-agent-coding-agent/ai-career-agent-coding-agent
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-career-agent-coding-agent/ai-career-agent-coding-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # /api/health reports the deployed commit (VERCEL_GIT_COMMIT_SHA).
      # Wait until production is running THIS push before testing it, so the
      # suite verifies the deploy, not the previous one.
      - name: Wait for the production deploy of this commit
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 60); do
            DEPLOYED=$(curl -s --max-time 10 https://jobiest.com/api/health | jq -r '.commit // empty')
            if [ "$DEPLOYED" = "$SHA" ]; then
              echo "Deploy $SHA is live."
              exit 0
            fi
            echo "Waiting for deploy $SHA (currently live: ${DEPLOYED:-none reported yet})."
            sleep 15
          done
          echo "Timed out waiting for the production deploy of $SHA."
          exit 1

      - name: Run production smoke suite
        run: npm run e2e
        env:
          E2E_BASE_URL: https://jobiest.com
