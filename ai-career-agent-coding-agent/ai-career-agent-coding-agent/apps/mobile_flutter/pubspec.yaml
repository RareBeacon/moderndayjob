name: jobiest
description: >-
  Jobiest — Your next opportunity is here. The official Jobiest mobile app:
  a native mobile client for the Jobiest career platform (jobs, applications,
  CV studio, AI agent). Consumes the existing jobiest.com backend; no product
  logic is duplicated on-device.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Auth + session (Supabase is the platform's auth provider; the anon key is
  # the public publishable key — the security boundary is RLS + the API layer,
  # exactly like the website).
  supabase_flutter: ^2.8.0

  # Routing + deep links (jobiest://job/{id}, jobiest://auth/callback).
  go_router: ^14.6.0

  # State management: small, official, boring on purpose.
  provider: ^6.1.2

  # API client for the existing jobiest.com REST surface.
  http: ^1.2.2

  # Secure on-device session persistence (Keystore / Keychain).
  flutter_secure_storage: ^9.2.2

  # Opening job links, checkout, emails and generated-document URLs.
  url_launcher: ^6.3.1

  # Share a job.
  share_plus: ^10.1.2

  # TOTP enrollment QR code (native MFA setup).
  qr_flutter: ^4.1.0

  # Picking a PDF master CV from the device.
  file_picker: ^8.1.6

  # Dates, plurals, number formatting.
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
