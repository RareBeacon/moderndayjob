name: Flutter Android app

# Builds the native Flutter Android client (apps/jobiest-mobile).
#
#   - push / pull request : analyze + unit tests + release APK
#   - workflow_dispatch   : same, on demand
#   - tag app-v*          : same, and the APK is attached to a GitHub release
#
# The APK is uploaded as a workflow artifact on every run, so a build that
# compiles is provable by downloading the file — not by reading a log line.

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/jobiest-mobile/**'
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/app/api/mobile/**'
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/.github/workflows/flutter-android.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/jobiest-mobile/**'
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/app/api/mobile/**'
      - 'ai-career-agent-coding-agent/ai-career-agent-coding-agent/.github/workflows/flutter-android.yml'

env:
  APP_DIR: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/jobiest-mobile

jobs:
  build-apk:
    name: Analyze · test · build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/jobiest-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Restore Gradle wrapper (binary file, generated by flutter create)
        run: ./tool/bootstrap_android.sh

      - name: Static analysis
        # Infos are advisory; errors and warnings fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify the APK exists
        run: |
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          ls -l "$APK"
          test -s "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: jobiest-android-apk
          path: ai-career-agent-coding-agent/ai-career-agent-coding-agent/apps/jobiest-mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
