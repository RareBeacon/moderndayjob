name: jobiest_mobile
description: Jobiest for Android — native Flutter client for the Jobiest career platform.
publish_to: "none"
version: 1.0.0+1

# The app talks to the existing Jobiest backend (https://jobiest.com) using the
# Bearer-token contract already supported by lib/auth.ts on the server. No
# secrets live in this project: the Supabase anon key is fetched at runtime
# from the public GET /api/mobile/config endpoint (the same value the website
# already ships to every browser).
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
